# Enables auto-merge on Dependabot pull requests that are not semver-major.
# The merge still waits for the required checks on main. Major updates are
# left for a human to review, and so is any update to Anthropic or Claude
# tooling: a new version of the agent harness changes how the maintenance
# agents behave, so it must pass their evaluation drills first.
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: auto-merge
    # Check the PR author, not github.actor, which a re-run can change.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'blip-box/confusable'
    runs-on: ubuntu-latest
    # The default token for Dependabot runs is read-only, so the scopes the
    # auto-merge API needs must be requested explicitly.
    permissions:
      contents: write # merge the pull request once checks pass
      pull-requests: write # enable auto-merge on the pull request
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major'
          && !contains(steps.metadata.outputs.dependency-names, 'anthropic')
          && !contains(steps.metadata.outputs.dependency-names, 'claude')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

# Guild release proposals for an adopting repository. Copy to .github/workflows/.
#
# After every push to the default branch and every Monday: read the changes
# merged since the last tag, decide whether a release is due (a fix or a
# feature to the library, or unreleased changes older than
# release.stale_days in guild.toml) and open or update the proposal issue
# through the Triage App. A script, no model: the change list is the merged
# pull request titles and the credits come from the ledger. A steward
# approves and runs the release; releases are tier 3.
#
# Add this workflow to the `scheduled` job of ci.yml; a failure here opens
# or comments on an issue, so it never fails silently.
name: Guild release

on:
  push:
    branches: [main] # the default branch
  schedule:
    - cron: "47 8 * * 1" # Mondays, 08:47 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  propose:
    name: propose
    if: vars.GUILD_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # the history and tags, guild.toml, the shell, the ledger branch
      issues: write # report a failure
    outputs:
      due: ${{ steps.release.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0 # the changes since the last tag
          fetch-tags: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blip-box/guild
          ref: ${{ vars.GUILDKIT_REF }}
          path: .guild
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --no-default-groups --project .guild
      - name: The ledger
        # The branch is public, so an anonymous fetch does; without it the
        # credits are empty.
        run: |
          if git fetch --quiet --depth=1000 origin guild-ledger 2>/dev/null; then
            git show origin/guild-ledger:ledger.jsonl > "$RUNNER_TEMP/ledger.jsonl"
          else
            : > "$RUNNER_TEMP/ledger.jsonl"
          fi
      - name: The unreleased changes
        id: log
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=HEAD
          [ -z "$tag" ] || range="$tag..HEAD"
          git log "$range" --format='commit%x09%H%x09%cI%x09%s' --name-only > "$RUNNER_TEMP/log.txt"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "unreleased since '${tag:-the beginning}': $(grep -c '^commit' "$RUNNER_TEMP/log.txt") commits"
      - name: The test suite
        # The adopter's own command, as the Builder runs it. The proposal
        # says whether it passed at this commit; it does not block.
        id: tests
        run: |
          uv sync --locked
          command=$(uv run --project .guild guildkit config-get --config guild.toml test_command)
          status=0
          sh -c "$command" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Propose
        id: release
        env:
          TAG: ${{ steps.log.outputs.tag }}
          TESTS: ${{ steps.tests.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          status=0
          uv run --project .guild guildkit release \
            --config guild.toml \
            --log "$RUNNER_TEMP/log.txt" \
            --ledger "$RUNNER_TEMP/ledger.jsonl" \
            --last-tag "$TAG" \
            --pyproject pyproject.toml \
            --head "$(git rev-parse HEAD)" \
            --today "$(date -u +%F)" \
            --tests-exit "$TESTS" \
            --templates .guild/templates/release \
            --run-url "$RUN_URL" \
            --out "$RUNNER_TEMP/out/proposal.json" \
            --out-title "$RUNNER_TEMP/out/title.txt" \
            --out-body "$RUNNER_TEMP/out/body.md" || status=$?
          # 4 is "not due"; anything else is an error.
          case "$status" in 0) due=true ;; 4) due=false ;; *) exit "$status" ;; esac
          echo "due=$due" >> "$GITHUB_OUTPUT"
          {
            echo "## Guild release"
            echo
            uv run --project .guild guildkit summary --kind release --file "$RUNNER_TEMP/out/proposal.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release
          path: |
            ${{ runner.temp }}/out/proposal.json
            ${{ runner.temp }}/out/title.txt
            ${{ runner.temp }}/out/body.md
          if-no-files-found: ignore
          retention-days: 90
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The Guild release check is failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "It failed again: $RUN_URL"
          else
            printf 'The Guild release check failed: %s\n\nUntil it is fixed, a due release goes unproposed.\n' "$RUN_URL" > body.md
            gh issue create --title "$title" --body-file body.md
          fi

  post:
    name: post the proposal
    needs: propose
    if: needs.propose.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # guild.toml and the pinned shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: guild.toml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blip-box/guild
          ref: ${{ vars.GUILDKIT_REF }}
          path: .guild
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --no-default-groups --project .guild
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.GUILD_TRIAGE_CLIENT_ID }}
          private-key: ${{ secrets.GUILD_TRIAGE_APP_KEY }}
          permission-issues: write
      - name: Open or update the proposal
        # One open proposal at a time, labelled guild:release: a later run
        # rewrites it rather than opening another. The title and body come
        # from the templates, the change list from merged pull request titles.
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title=$(cat title.txt)
          gh label create "guild:release" --force --color 5319e7 --description "Set by Guild"
          gh label create "needs steward" --force --color 5319e7 --description "Set by Guild"
          number=$(gh issue list --state open --label "guild:release" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file body.md
          else
            number=$(gh issue create --title "$title" --body-file body.md --label "guild:release" --label "needs steward" --json number --jq .number 2>/dev/null \
              || gh issue create --title "$title" --body-file body.md --label "guild:release" --label "needs steward" | grep -o '[0-9]*$')
          fi
          echo "NUMBER=$number" >> "$GITHUB_ENV"
      - name: The ledger entry
        run: |
          uv run --project .guild guildkit release-entry \
            --config guild.toml \
            --proposal proposal.json \
            --number "$NUMBER" \
            --out entry-releaser.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: entry-releaser
          path: entry-releaser.json
          retention-days: 90

  ledger:
    name: ledger
    needs: [propose, post]
    if: always() && needs.post.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the pinned shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: guild.toml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blip-box/guild
          ref: ${{ vars.GUILDKIT_REF }}
          path: .guild
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --no-default-groups --project .guild
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: entry-*
          merge-multiple: true
          path: entries
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.GUILD_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.GUILD_BUILDER_APP_KEY }}
          permission-contents: write
      - name: Append
        # As in guild-triage.yml: one signed commit with every entry, rebuilt
        # from the new head when a concurrent run got there first.
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          entries=$(find entries -name 'entry-*.json' | sort)
          [ -n "$entries" ] || { echo "no entries"; exit 0; }
          if ! head=$(gh api "repos/$GH_REPO/git/ref/heads/guild-ledger" --jq .object.sha 2>/dev/null); then
            echo "::warning::no guild-ledger branch; the entries stay in the artifacts"
            exit 0
          fi
          args=()
          for f in $entries; do args+=(--entry "$f"); done
          cat > query.graphql <<'QUERY'
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid } }
          }
          QUERY
          for attempt in 1 2 3 4 5; do
            gh api "repos/$GH_REPO/contents/ledger.jsonl?ref=guild-ledger" --jq .content 2>/dev/null \
              | base64 -d > current.jsonl || : > current.jsonl
            uv run --project .guild guildkit ledger-input \
              --config guild.toml --current current.jsonl "${args[@]}" \
              --head "$head" --run-url "$RUN_URL" --out input.json
            if gh api graphql -F input=@input.json -F query=@query.graphql --jq '.data.createCommitOnBranch.commit.oid'; then
              exit 0
            fi
            head=$(gh api "repos/$GH_REPO/git/ref/heads/guild-ledger" --jq .object.sha)
            echo "attempt $attempt failed; retrying from $head"
          done
          echo "::error::the ledger append failed five times"
          exit 1

# Pull requests are squash-merged, so the PR title becomes the commit on main.
# Lint both the title and the individual commits as Conventional Commits.
name: Commit lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commits:
    name: commits
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out .commitlintrc.yml and the PR commits
      pull-requests: read # list the commits in the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.yml

  title:
    name: pr title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # read the pull request title
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Matches commitlint's subject-case rule: no capitalised subjects.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The subject "{subject}" starts with a capital letter. Start it in
            lower case, for example "feat: add skeleton()".

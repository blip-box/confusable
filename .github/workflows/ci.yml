# Lint and test on every pull request and on pushes to main.
# Branch protection on main requires only the "required" job, so the matrix
# can change without editing repository settings.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Runs ruff, mypy, zizmor, actionlint, uv-lock and the file hygiene hooks.
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --no-sync pytest

  # Everything generated from Unicode data must match a fresh run: the package's
  # data tables and the conformance fixtures.
  generated:
    name: generated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # Building ICU takes minutes; reuse the build while its inputs are unchanged.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/.cache
            tools/oracles/icu/.build/icu-*
            tools/oracles/icu/.build/*.tgz
            tools/oracles/rust/target
            ~/.cargo/registry
          key: generated-${{ runner.os }}-${{ hashFiles('tools/unicode_sources.py', 'tools/oracles/icu/build.sh', 'tools/oracles/icu/patches/*.patch', 'tools/oracles/rust/Cargo.lock', 'tools/oracles/rust_regen.py') }}
      - run: uv run --no-project --python 3.14 python -m tools.generate_tables --check
      - run: uv run --no-project --python 3.14 python -m tools.oracles.generate --check

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Fail CI while one is disabled, so a person notices.
  scheduled:
    name: scheduled
    runs-on: ubuntu-latest
    permissions:
      actions: read # read the state of the scheduled workflows
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh api "repos/$GH_REPO/actions/workflows" --jq '.workflows[] | select(.path == ".github/workflows/unicode-release.yml") | .state')
          # Empty until the workflow first reaches the default branch.
          if [ -n "$state" ] && [ "$state" != "active" ]; then
            echo "::error::unicode-release.yml is $state. Re-enable it: gh workflow enable unicode-release.yml"
            exit 1
          fi

  required:
    name: required
    if: always()
    needs: [lint, test, generated, scheduled]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

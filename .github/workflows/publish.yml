# Publishes a tagged release to PyPI through trusted publishing, so no API
# token exists anywhere. A steward runs a release (C-GOV-1): after the
# version bump merges, they tag its commit `vX.Y.Z` and push the tag. This
# checks that the tag names the version, runs the test suite once more on
# the tagged commit, builds the sdist and the wheel, uploads them from the
# `pypi` environment, which only `v*` tags may deploy to, and creates the
# GitHub Release the Changelog URL points at. PyPI's pending publisher names
# this repository, this file and that environment.
name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - name: Check that the tag names the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::the tag $TAG does not name the version $version"
            exit 1
          fi
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --no-sync pytest
      - run: uv build
      - name: Check that the wheel ships the Unicode notice
        run: unzip -l dist/*.whl | grep -q 'licenses/LICENSES/Unicode-3.0.txt'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/confusable/
    permissions:
      id-token: write # the OIDC token that PyPI's trusted publisher exchanges for an upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Verifies the metadata, uploads with attestations and prints the hashes.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes --title "$TAG")
          case "$TAG" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*|*dev[0-9]*) args+=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/* "${args[@]}"

# Guild configuration for this repository: the stewards, the risk tiers, the
# pinned models and their prices. The shell that reads it is blip-box/guild.
# Changing this file is a tier 2 change; agents cannot change it.

[guild]
repo = "blip-box/confusable"
charter = "CHARTER.md"

[stewards]
logins = ["atillaguzel"]
max = 3

# Risk tiers, computed by plain code from the paths a change touches. The
# highest tier any rule gives wins; the shape of the diff can only raise it.
# Paths on the reject list are never tiered: agents draft, a steward commits.
[tiers.paths]
reject = [
    ".github/**",
    ".claude/**",
    "CLAUDE.md",
    "AGENTS.md",
    "CHARTER.md",
    "guild.toml",
    "conftest.py",
    ".pre-commit-config.yaml",
]
t0 = ["*.md", "LICENSES/**", "src/confusable/_data/**"]
t1 = []
t2 = ["pyproject.toml", "uv.lock", "tools/**", "src/confusable/__init__.py"]
t3 = []
default = "t1"

[tiers.shape]
tests = ["tests/**"]
max_t0_lines = 50
deleted_tests = "t2"
deleted_files = "t1"
changed_tests = "t1"

# Kinds of change that paths cannot show; a plan or a steward declares them.
[tiers.kinds]
public_api = "t2"
spec_departure = "t2"
new_data_source = "t2"
release = "t3"
advisory = "t3"

[triage]
# Pinned in full. A change here goes through the drills first.
model = "claude-haiku-5-5"
# Thinking is on by default on this model and counts against max_tokens.
max_tokens = 1500
cap_usd = 0.10
per_author_per_day = 3
daily_runs = 40

# The agents, through the Claude Agent SDK. Every role starts on the strongest
# model and moves down only when the drills show no loss. cap_usd is a brake
# on one run (the SDK's own estimate); the ledger prices the tokens itself.
[planner]
model = "claude-opus-5-5"
max_turns = 40
cap_usd = 1.00
effort = "high"

[builder]
model = "claude-opus-5-5"
max_turns = 80
cap_usd = 4.00
effort = "high"
# Run in the checkout before the Builder may finish, and again by the plain
# check. The workflow installs the environment first; --no-sync keeps the
# agent from installing anything.
test_command = "uv run --no-sync pytest -q -x"
# How many times the Builder may fail the tests and try again before the
# run ends as failed.
max_test_rounds = 3
# Generated files may change only together with their generator.
generated = ["src/confusable/_data/**", "tests/conformance/fixtures/**"]
generators = ["tools/**"]

# The second attempt, when the first fails the plain check: a fresh checkout
# at the same base, a stronger setting, its own cap, and the check's reasons
# in the brief. Without this table a task gets one attempt. The strongest
# model is already the first choice, so the escalation here is effort.
[builder.second_attempt]
model = "claude-opus-5-5"
max_turns = 100
cap_usd = 6.00
effort = "max"

[reviewer]
model = "claude-opus-5-5"
max_turns = 40
cap_usd = 2.00
effort = "high"

# Releases. The Releaser is a script with no model call: it proposes a release
# when a merged fix or feature touched the library, or when the oldest
# unreleased change is stale_days old, as an issue a steward acts on (T3).
[release]
# Paths whose change is a change to what the library does.
library = ["src/confusable/**"]
stale_days = 28
# Where the version is written; the steward's checklist names them.
version_files = ["pyproject.toml", "src/confusable/__init__.py"]
# While set, proposals are pre-releases ("a", "b" or "rc"); remove it for
# the first final release.
prerelease = "a"

# US dollars per million tokens, Anthropic API list prices, for the ledger.
# Partner platforms price differently: add their IDs with their prices.
[models."claude-haiku-5-5"]
input_per_mtok = 0.10
output_per_mtok = 0.50
cache_read_per_mtok = 0.01
cache_write_per_mtok = 0.125

[models."claude-opus-5-5"]
input_per_mtok = 4.00
output_per_mtok = 20.00
cache_read_per_mtok = 0.20
cache_write_per_mtok = 5.00
